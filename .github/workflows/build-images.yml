name: Build Images

# Validates that every service/stub Docker image still builds (no push) whenever
# its sources change. Code-quality checks (build/test/lint/typecheck/license)
# live in ci.yml's verify job; image publishing on release lives in release.yml.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ── Detect which image sources changed ───────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-images: ${{ steps.set-matrix.outputs.has-images }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            aep-server:
              - 'tools/aepctl/**'
            aep-api:
              - 'services/aep-api/**'
            agents:
              - 'services/agents/**'
              - 'packages/**'
            collab:
              - 'services/collab/**'
              - 'packages/**'
            aep-mcp-server:
              - 'services/aep-mcp-server/**'
              - 'packages/**'
            console:
              - 'apps/console/**'
              - 'packages/**'
            remote-worker:
              - 'runners/remote-worker/**'
            cluster-gateway-proxy:
              - 'deployments/local-cluster-gateway-proxy/**'

      - id: set-matrix
        run: |
          ALL='{
            "aep-server":   {"dockerfile":"tools/aepctl/Dockerfile.server","context":"tools/aepctl"},
            "aep-api":      {"dockerfile":"services/aep-api/Dockerfile","context":"services/aep-api","buildContexts":"skills=skills"},
            "agents":       {"dockerfile":"services/agents/Dockerfile","context":"."},
            "collab":       {"dockerfile":"services/collab/Dockerfile","context":"."},
            "aep-mcp-server":{"dockerfile":"services/aep-mcp-server/Dockerfile","context":"."},
            "remote-worker":{"dockerfile":"runners/remote-worker/Dockerfile","context":"runners/remote-worker"},
            "console":      {"dockerfile":"apps/console/Dockerfile","context":"."},
            "cluster-gateway-proxy":{"dockerfile":"deployments/local-cluster-gateway-proxy/Dockerfile","context":"deployments/local-cluster-gateway-proxy"}
          }'
          CHANGES='${{ steps.filter.outputs.changes }}'
          matrix=$(echo "$CHANGES" | jq -c --argjson all "$ALL" \
            '[.[] | {name: ., dockerfile: $all[.].dockerfile, context: $all[.].context, buildContexts: ($all[.].buildContexts // "")}]')
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          if [ "$CHANGES" = "[]" ]; then
            echo "has-images=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-images=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Build changed images (no push) ──────────────────────────────────────────
  build-images:
    name: Build ${{ matrix.name }} image
    needs: changes
    if: needs.changes.outputs.has-images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # aep-api pulls repo-root skills/ in as a named context (empty for
          # every other image); see services/aep-api/Dockerfile COPY --from=skills.
          build-contexts: ${{ matrix.buildContexts }}
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
