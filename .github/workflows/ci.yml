name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: make install

      - name: Install pinned Go tools (golangci-lint)
        run: make tools

      - name: go.sum consistency check
        run: |
          for d in $(go list -m -f '{{.Dir}}'); do
            echo ">> go mod tidy -diff $d"
            (cd "$d" && go mod tidy -diff)
          done

      - name: Typecheck
        run: make typecheck

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Contract codegen freshness (aep-api)
        run: make -C services/aep-api gen-api-check

      - name: Lint
        run: make lint

      - name: License header check
        run: make license-check
