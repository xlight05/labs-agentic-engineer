# Upstream resolver for in-cluster DNS. Mounted into the k3d server node at
# /etc/k3s-resolv.conf and handed to kubelet via `--resolv-conf` in
# k3d-local-config.yaml, so every pod with dnsPolicy: Default — CoreDNS above
# all — gets THIS file as its resolver instead of a snapshot of whatever the
# node's /etc/resolv.conf happened to contain when the pod was created.
#
# Why it has to be static: CoreDNS's `.:53` block forwards to
# /etc/resolv.conf, and the forward plugin reads that file ONCE at process
# start. On Colima the node's resolv.conf is re-derived by Docker on each
# daemon start and can briefly name the VM's user-mode network gateway
# (192.168.5.2), which stops answering DNS once the VM's networking settles.
# CoreDNS latches that address forever, external resolution dies cluster-wide,
# and coding-agent runs fail at `git clone` with "Could not resolve host".
# Pinning the file removes the race: there is nothing transient to latch.
#
# These are public resolvers — the same fallback k3s itself uses when a node
# has only a loopback nameserver. If you need split-horizon or corporate DNS
# for in-cluster lookups, put those servers here and recreate the cluster
# (`files:` entries are applied at node creation only).
#
# Node-level DNS for image pulls is separate and stays on the node's own
# /etc/resolv.conf — see fix_node_dns in scripts/utils.sh.
nameserver 8.8.8.8
nameserver 1.1.1.1
options ndots:0
