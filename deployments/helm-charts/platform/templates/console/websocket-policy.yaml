# Enable WebSocket upgrades on the OpenChoreo gateway listener so the console's
# /collab spec-collaboration WebSocket can traverse it. kgateway/Envoy rejects
# WS upgrades by default (403). HTTPListenerPolicy can only target a Gateway, so
# this is listener-level and lives in the gateway's namespace. Additive: it only
# ALLOWS the websocket upgrade; non-WS traffic on the listener is unaffected.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: aep-websocket-upgrade
  namespace: openchoreo-control-plane
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-default
  upgradeConfig:
    enabledUpgrades:
      - websocket
