openapi: 3.0.3
info:
  title: AEP BFF API — components
  description: Shared schema components for the AEP BFF public contract. Referenced by ./openapi.yaml;
    kept as its own document so Go types and server code can generate into separate packages.
  version: 1.0.0
paths: {}
components:
  schemas:
    AccessRequest:
      additionalProperties: false
      properties:
        consumerComponentName:
          type: string
        consumerProjectId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        orgServiceName:
          type: string
        providerComponentName:
          type: string
        providerIssueNumber:
          format: int64
          type: integer
        providerIssueUrl:
          type: string
        providerProjectId:
          type: string
        providerTaskId:
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - consumerProjectId
      - consumerComponentName
      - orgServiceName
      - status
      - createdAt
      - updatedAt
      type: object
    ApplyRequest:
      additionalProperties: false
      properties:
        deletes:
          items:
            $ref: '#/components/schemas/DeleteOp'
          type: array
          nullable: true
        message:
          type: string
        writes:
          items:
            $ref: '#/components/schemas/WriteOp'
          type: array
          nullable: true
      type: object
    ApplyResult:
      additionalProperties: false
      properties:
        commitSha:
          type: string
        files:
          items:
            $ref: '#/components/schemas/FileMeta'
          type: array
          nullable: true
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          nullable: true
      required:
      - commitSha
      - files
      type: object
    ApplyConflict:
      additionalProperties: false
      description: One file whose baseSha no longer matches HEAD.
      properties:
        baseSha:
          type: string
        currentSha:
          type: string
        path:
          type: string
      required:
      - path
      - baseSha
      - currentSha
      type: object
    ApplyConflicts:
      additionalProperties: false
      description: apply-files 409 body — the full conflict set; nothing was applied.
      properties:
        conflicts:
          items:
            $ref: '#/components/schemas/ApplyConflict'
          type: array
      required:
      - conflicts
      type: object
    BuildInputItem:
      additionalProperties: false
      properties:
        approved:
          type: boolean
        component:
          description: Owning component name
          type: string
        dependency:
          description: Dependency name
          type: string
        kind:
          enum:
          - external-config
          - external-spec
          - platform-resource
          - org-service
          type: string
        parameters:
          additionalProperties: {}
          type: object
        specContent:
          type: string
        specUrl:
          type: string
        values:
          items:
            $ref: '#/components/schemas/ConfigValue'
          type: array
          nullable: true
      required:
      - component
      - dependency
      - kind
      type: object
    BuildList:
      additionalProperties: false
      description: list-project-builds response — one entry per built spec version tag, newest first.
      properties:
        builds:
          items:
            $ref: '#/components/schemas/BuildSummary'
          type: array
          nullable: true
      required:
      - builds
      type: object
    BuildLogEntry:
      additionalProperties: false
      properties:
        level:
          type: string
        log:
          type: string
        timestamp:
          type: string
      required:
      - log
      type: object
    BuildLogs:
      additionalProperties: false
      properties:
        logs:
          items:
            $ref: '#/components/schemas/BuildLogEntry'
          type: array
          nullable: true
        totalCount:
          format: int64
          type: integer
      required:
      - logs
      type: object
    BuildPreflight:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/PreflightItem'
          type: array
          nullable: true
        needsInput:
          type: boolean
      required:
      - needsInput
      - items
      type: object
    BuildRequest:
      additionalProperties: false
      properties:
        inputs:
          items:
            $ref: '#/components/schemas/BuildInputItem'
          type: array
          nullable: true
      type: object
    BuildResponse:
      additionalProperties: false
      properties:
        failures:
          items:
            $ref: '#/components/schemas/InputFailure'
          type: array
          nullable: true
        tag:
          type: string
      type: object
    BuildStage:
      additionalProperties: false
      description: Build-stage aggregate on ProjectStatus (#184) — the tag being/last built and its task
        counts, so the overview needs no list-tasks read.
      properties:
        status:
          description: idle (never built), running, failed, succeeded
          enum:
          - idle
          - running
          - failed
          - succeeded
          type: string
          x-go-type: string
        tasks:
          additionalProperties: false
          description: Task counts bucketed from derivedStatus.
          properties:
            active:
              format: int64
              type: integer
            done:
              format: int64
              type: integer
            failed:
              format: int64
              type: integer
            total:
              format: int64
              type: integer
          required:
          - total
          - done
          - failed
          - active
          type: object
        version:
          description: Spec tag the current/last build built; "" if never built.
          type: string
      required:
      - version
      - status
      - tasks
      type: object
    BuildStatus:
      additionalProperties: false
      properties:
        reason:
          description: Failure detail for a failed build (empty otherwise) — the devflow's recorded error,
            so the console can show WHY it failed.
          type: string
        status:
          enum:
          - started
          - in_progress
          - completed
          - failed
          type: string
          x-go-type: string
        tasks:
          items:
            $ref: '#/components/schemas/BuildStatusTask'
          type: array
          nullable: true
        workflow_status:
          type: string
      required:
      - status
      - workflow_status
      type: object
    BuildStatusTask:
      additionalProperties: false
      properties:
        issueNumber:
          description: GitHub issue number of the Task — links a build-status row to its issue (and to
            the task-log stream); replaces the old title-join.
          format: int64
          type: integer
        status:
          enum:
          - started
          - in_progress
          - completed
          - failed
          type: string
        title:
          type: string
      required:
      - title
      - status
      type: object
    BuildSummary:
      additionalProperties: false
      description: One entry of list-project-builds — a spec version tag's newest run. A list read has
        no live workflow query, so "started" never occurs here.
      properties:
        completedAt:
          format: date-time
          type: string
          nullable: true
          x-go-type: '*time.Time'
        reason:
          description: Failure detail for a failed build (empty otherwise) — the devflow's recorded error,
            surfaced beside the Failed badge in the console.
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          enum:
          - started
          - in_progress
          - completed
          - failed
          type: string
        tag:
          type: string
        tasks:
          $ref: '#/components/schemas/BuildTally'
      required:
      - tag
      - status
      - tasks
      - startedAt
      type: object
    BuildTally:
      additionalProperties: false
      properties:
        active:
          format: int64
          type: integer
        done:
          format: int64
          type: integer
        failed:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
      - total
      - done
      - failed
      - active
      type: object
    ClientSecretOutputBody:
      additionalProperties: false
      properties:
        clientSecret:
          type: string
      required:
      - clientSecret
      type: object
    CollabSessionOutputBody:
      additionalProperties: false
      properties:
        email:
          type: string
        roomId:
          type: string
        userName:
          type: string
        wsUrl:
          type: string
      required:
      - roomId
      - wsUrl
      - userName
      - email
      type: object
    CollabValidateOutputBody:
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
        projectName:
          description: The room's project, resolved by the oracle from `spec-<org>-<project>`; the collab
            service uses it for the seed read (#114).
          type: string
      required:
      - name
      - email
      - projectName
      type: object
    Component:
      additionalProperties: false
      properties:
        autoBuild:
          type: boolean
        autoDeploy:
          type: boolean
        createdAt:
          type: string
        description:
          type: string
        displayName:
          type: string
        endpointUrl:
          description: Public URL of the running dev deployment. Populated for web applications only;
            absent until deployed.
          type: string
        name:
          type: string
        projectName:
          type: string
        status:
          type: string
        type:
          description: Component kind in AEP's design vocabulary — "web-application" or "service" (matching
            design.json's componentType). OpenChoreo's prefixed ComponentType names (deployment/*) never
            appear on this API.
          type: string
        uid:
          type: string
      required:
      - name
      type: object
    ComponentConfig:
      nullable: true
      additionalProperties: false
      properties:
        componentName:
          type: string
        createdAt:
          format: date-time
          type: string
        envVars:
          items:
            $ref: '#/components/schemas/EnvVar'
          type: array
          nullable: true
        id:
          type: string
        projectName:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - projectName
      - componentName
      - envVars
      - createdAt
      - updatedAt
      type: object
    ComponentList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Component'
          type: array
          nullable: true
      required:
      - items
      type: object
    ComponentOpenAPI:
      additionalProperties: false
      properties:
        componentName:
          type: string
        componentType:
          type: string
        spec:
          type: string
      required:
      - componentName
      - componentType
      - spec
      type: object
    ConfigKeyDTO:
      additionalProperties: false
      properties:
        defaultValue:
          type: string
        description:
          type: string
        key:
          type: string
        secret:
          type: boolean
      required:
      - key
      type: object
    ConfigKeyView:
      additionalProperties: false
      properties:
        defaultValue:
          type: string
        description:
          type: string
        key:
          type: string
        secret:
          type: boolean
      required:
      - key
      type: object
    ConfigPatch:
      additionalProperties: false
      properties:
        gitProvider:
          additionalProperties: false
          properties:
            githubLogin:
              type: string
            kind:
              enum:
              - github
              type: string
            mode:
              enum:
              - pat
              type: string
            pat:
              type: string
          required:
          - kind
          - mode
          - pat
          type: object
          nullable: true
        idp:
          additionalProperties: false
          properties:
            issuer:
              type: string
            jwksUrl:
              type: string
            kind:
              enum:
              - platform
              - asgardeo
              - custom
              type: string
          required:
          - kind
          type: object
          nullable: true
        llm:
          additionalProperties: false
          properties:
            apiKey:
              type: string
            kind:
              enum:
              - anthropic
              type: string
          required:
          - kind
          - apiKey
          type: object
          nullable: true
      type: object
    ConfigProjection:
      additionalProperties: false
      properties:
        gitProvider:
          allOf:
          - $ref: '#/components/schemas/GitProviderProjection'
          nullable: true
        idp:
          $ref: '#/components/schemas/IDPProjection'
        llm:
          allOf:
          - $ref: '#/components/schemas/LLMProjection'
          nullable: true
      required:
      - llm
      - gitProvider
      - idp
      type: object
    ConfigValue:
      additionalProperties: false
      properties:
        key:
          type: string
        value:
          type: string
      required:
      - key
      - value
      type: object
    ConsumerDTO:
      additionalProperties: false
      properties:
        componentName:
          type: string
        projectId:
          type: string
      required:
      - projectId
      - componentName
      type: object
    CreateProjectRequest:
      additionalProperties: false
      properties:
        deploymentPipeline:
          type: string
        description:
          type: string
        displayName:
          type: string
        name:
          type: string
        prompt:
          description: 'The user''s initial requirement — what they want built. Persisted as the project''s
            requirement and kicks off spec derivation for the new project (issue #72). Projects created
            without a prompt keep today''s behavior.'
          type: string
        repoName:
          description: 'Repository name for the project''s GitHub repo; defaults to the project name,
            the organization is fixed server-side (issue #71).'
          type: string
      required:
      - name
      type: object
    CreateRcaAgentReportRequest:
      additionalProperties: false
      description: Write-side request for a new RCA-agent alert report (issue
      properties:
        classification:
          description: code-level, config-level, mixed, or none — set by the handoff agent
          type: string
        component:
          type: string
        deployed:
          type: boolean
        deployedAt:
          type: string
          format: date-time
          nullable: true
          x-go-type: '*time.Time'
        diagnosis:
          description: Full RCA diagnosis + remediation content (markdown)
          type: string
        dispatched:
          type: boolean
        issueExcerpt:
          type: string
        issueNumber:
          format: int64
          type: integer
          nullable: true
          x-go-type: '*int64'
        issueTitle:
          type: string
        issueUrl:
          type: string
        project:
          type: string
        summary:
          type: string
        title:
          type: string
      required:
      - project
      - title
      - summary
      - classification
      - diagnosis
      type: object
    CreateSkillInput:
      additionalProperties: false
      properties:
        name:
          type: string
        references:
          additionalProperties:
            type: string
          type: object
        skillMd:
          type: string
      required:
      - name
      - skillMd
      type: object
    DeleteOp:
      additionalProperties: false
      properties:
        baseSha:
          type: string
        path:
          type: string
      required:
      - path
      type: object
    DependencyStatus:
      additionalProperties: false
      properties:
        outputs:
          items:
            type: string
          type: array
          nullable: true
        ready:
          type: boolean
        status:
          type: string
      required:
      - status
      - ready
      - outputs
      type: object
    DeployStage:
      additionalProperties: false
      description: Deploy-stage aggregate on ProjectStatus (#184) — what's live in dev and rollout progress.
      properties:
        components:
          additionalProperties: false
          description: Component rollout progress for the current deploy.
          properties:
            ready:
              format: int64
              type: integer
            total:
              format: int64
              type: integer
          required:
          - total
          - ready
          type: object
        status:
          enum:
          - none
          - deploying
          - deployed
          - failed
          type: string
          x-go-type: string
        version:
          description: Spec tag live in dev; "" if nothing deployed.
          type: string
      required:
      - version
      - status
      - components
      type: object
    Deployment:
      additionalProperties: false
      properties:
        componentName:
          type: string
        createdAt:
          type: string
        endpointUrl:
          type: string
        environment:
          type: string
        name:
          type: string
        releaseName:
          type: string
        status:
          type: string
      type: object
    DeploymentList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Deployment'
          type: array
          nullable: true
      required:
      - items
      type: object
    DisconnectOutputBody:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
      - status
      type: object
    DiscoverOutputBody:
      additionalProperties: false
      properties:
        issuer:
          type: string
        jwksUrl:
          type: string
      required:
      - issuer
      - jwksUrl
      type: object
    EnvVar:
      additionalProperties: false
      properties:
        key:
          type: string
        value:
          type: string
      required:
      - key
      - value
      type: object
    Error:
      description: Flat error envelope returned by every non-2xx response.
      type: object
      additionalProperties: false
      properties:
        code:
          description: Machine-readable error code (stable slug).
          type: string
          example: validation_failed
        message:
          description: Human-readable error message.
          type: string
          example: request body is invalid
        details:
          description: Field-level details for validation errors.
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
      - code
      - message
    ErrorDetail:
      description: One field-level validation error.
      type: object
      additionalProperties: false
      properties:
        field:
          description: Location of the offending field (e.g. body.name).
          type: string
        message:
          description: What is wrong with the field.
          type: string
      required:
      - field
      - message
    ExecutionView:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        endedAt:
          format: date-time
          type: string
          nullable: true
          x-go-type: '*time.Time'
        id:
          type: string
        kind:
          type: string
        reason:
          type: string
        runName:
          type: string
        startedAt:
          format: date-time
          type: string
          nullable: true
          x-go-type: '*time.Time'
        status:
          type: string
      required:
      - id
      - kind
      - status
      - createdAt
      type: object
    ExternalResourceDTO:
      additionalProperties: false
      properties:
        config:
          items:
            $ref: '#/components/schemas/ConfigKeyDTO'
          type: array
          nullable: true
        consumers:
          items:
            $ref: '#/components/schemas/ConsumerDTO'
          type: array
          nullable: true
        description:
          type: string
        name:
          type: string
      required:
      - name
      - config
      - consumers
      type: object
    FileContent:
      additionalProperties: false
      properties:
        content:
          type: string
        path:
          type: string
        sha:
          type: string
      required:
      - path
      - content
      - sha
      type: object
    FileMeta:
      additionalProperties: false
      properties:
        path:
          type: string
        sha:
          type: string
        size:
          format: int64
          type: integer
      required:
      - path
      - sha
      type: object
    GitProviderProjection:
      additionalProperties: false
      properties:
        connectedAt:
          format: date-time
          type: string
        githubLogin:
          type: string
        identityChangedAt:
          format: date-time
          type: string
        identityEmail:
          type: string
        identityLogin:
          type: string
        identityName:
          type: string
        installationId:
          format: int64
          type: integer
        kind:
          enum:
          - github
          type: string
        lastValidatedAt:
          format: date-time
          type: string
        mode:
          enum:
          - app
          - pat
          type: string
        prevIdentityLogin:
          type: string
        selectedRepos:
          items:
            type: string
          type: array
          nullable: true
        status:
          type: string
      required:
      - kind
      - mode
      - status
      - connectedAt
      type: object
    IDPProjection:
      additionalProperties: false
      properties:
        hasClientSecret:
          type: boolean
        issuer:
          type: string
        jwksUrl:
          type: string
        kind:
          enum:
          - platform
          - asgardeo
          - custom
          type: string
        publisherClientId:
          type: string
      required:
      - kind
      - issuer
      - jwksUrl
      - publisherClientId
      - hasClientSecret
      type: object
    ImportResult:
      additionalProperties: false
      properties:
        compatibility:
          type: string
        kind:
          type: string
        license:
          type: string
        name:
          type: string
        warnings:
          items:
            type: string
          type: array
          nullable: true
      required:
      - name
      - kind
      - warnings
      type: object
    InputFailure:
      additionalProperties: false
      properties:
        component:
          type: string
        dependency:
          type: string
        kind:
          type: string
        reason:
          type: string
      required:
      - dependency
      - reason
      type: object
    CreateIssueRequest:
      additionalProperties: false
      description: Issue to file on the project's repo. dedupeKey makes creation
        idempotent per open issue (label-encoded), for concurrent alert handlers.
      properties:
        title:
          type: string
        body:
          type: string
        labels:
          items:
            type: string
          type: array
          nullable: true
        dedupeKey:
          type: string
      required:
      - title
      - body
      type: object
    IssueResult:
      additionalProperties: false
      description: Issue metadata after create. deduped=true means an open issue
        with the same dedupeKey already existed — number/url refer to it.
      properties:
        number:
          format: int64
          type: integer
        url:
          type: string
        nodeId:
          type: string
        deduped:
          type: boolean
      required:
      - number
      - url
      - nodeId
      type: object
    IssueInfo:
      additionalProperties: false
      description: 'One issue from list/search. Field names are CAPITALIZED on
        the wire (historical shape the deployed aep-mcp-server parses — do not
        "fix" without a coordinated MCP-server release).'
      properties:
        Number:
          format: int64
          type: integer
        Title:
          type: string
        Body:
          type: string
        URL:
          type: string
        State:
          type: string
        Labels:
          items:
            type: string
          type: array
          nullable: true
      required:
      - Number
      - Title
      - Body
      - URL
      - State
      - Labels
      type: object
    LLMProjection:
      additionalProperties: false
      properties:
        connectedAt:
          format: date-time
          type: string
        keyLast4:
          type: string
        keyPrefix:
          type: string
        kind:
          enum:
          - anthropic
          type: string
        lastValidatedAt:
          format: date-time
          type: string
        status:
          type: string
        validationError:
          type: string
      required:
      - kind
      - keyPrefix
      - keyLast4
      - status
      - connectedAt
      type: object
    Lineage:
      additionalProperties: false
      properties:
        designTag:
          type: string
        specTag:
          type: string
      type: object
    OrganizationList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/OrganizationView'
          type: array
          nullable: true
      required:
      - items
      type: object
    OrganizationView:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        displayName:
          type: string
        name:
          type: string
        status:
          type: string
        uuid:
          type: string
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
      required:
      - uuid
      - name
      - createdAt
      type: object
    PlatformResourceTypeDTO:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        outputs:
          items:
            type: string
          type: array
          nullable: true
        parameters:
          additionalProperties: {}
          type: object
      required:
      - name
      type: object
    PreflightItem:
      additionalProperties: false
      properties:
        component:
          description: Owning component name
          type: string
        config:
          items:
            $ref: '#/components/schemas/ConfigKeyView'
          type: array
          nullable: true
        dependency:
          description: Dependency name
          type: string
        description:
          type: string
        kind:
          enum:
          - external-config
          - external-spec
          - platform-resource
          - org-service
          type: string
        parameters:
          additionalProperties: {}
          type: object
        resourceType:
          type: string
      required:
      - component
      - dependency
      - kind
      - description
      type: object
    ProgressEvent:
