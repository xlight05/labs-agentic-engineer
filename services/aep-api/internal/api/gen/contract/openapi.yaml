openapi: 3.0.3
info:
  title: AEP BFF API
  version: 1.0.0
servers:
- url: /api/v1
paths:
  /collab/validate:
    get:
      operationId: validate-collab-access
      parameters:
      - description: Collaboration room ID (spec-<org>-<project>)
        in: header
        name: X-Room-Id
        schema:
          description: Collaboration room ID (spec-<org>-<project>)
          type: string
      - description: Bearer token; the display identity is decoded from it
        in: header
        name: Authorization
        schema:
          description: Bearer token; the display identity is decoded from it
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/CollabValidateOutputBody
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Authorize a collaboration room (server-to-server)
      tags:
      - Collaboration
  /config:
    get:
      operationId: get-config
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/ConfigProjection
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Get the organization's integration config (statuses/kinds, no secrets)
      tags:
      - Org Config
    patch:
      operationId: update-config
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/components/schemas/ConfigPatch
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/ConfigProjection
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Patch the organization's integration config (per-section, atomic)
      tags:
      - Org Config
  /config/git-provider/connect-sessions:
    post:
      operationId: start-git-provider-connect
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/components/schemas/StartConnectInputBody
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/StartConnectOutputBody
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Start App-mode git-provider connect (OAuth-driven)
      tags:
      - Org Config
  /config/git-provider/disconnect:
    post:
      operationId: disconnect-git-provider
      parameters:
      - description: 'App-mode only: when false, leave the install on GitHub for later re-adoption (defaults
          true)'
        explode: false
        in: query
        name: uninstall
        schema:
          default: true
          description: 'App-mode only: when false, leave the install on GitHub for later re-adoption (defaults
            true)'
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/DisconnectOutputBody
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Disconnect the git provider (cascade) for the org
      tags:
      - Org Config
  /config/idp/client-secret:
    post:
      operationId: rotate-idp-client-secret
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/ClientSecretOutputBody
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Rotate the IDP publisher client secret (returned once)
      tags:
      - Org Config
  /config/idp/discovery:
    get:
      operationId: discover-idp
      parameters:
      - description: OIDC issuer URL to fetch the discovery document for
        explode: false
        in: query
        name: issuer
        schema:
          description: OIDC issuer URL to fetch the discovery document for
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/DiscoverOutputBody
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Discover an OIDC issuer's metadata
      tags:
      - Org Config
  /dependencies/external-resources:
    get:
      operationId: list-external-resources
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: ./components.yaml#/components/schemas/ExternalResourceDTO
                type: array
                nullable: true
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: List the org's external-resource catalog
      tags:
      - Dependencies
  /dependencies/external-resources/{name}:
    delete:
      operationId: delete-external-resource
      parameters:
      - description: External resource name
        in: path
        name: name
        required: true
        schema:
          description: External resource name
          type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Delete an external-resource catalog entry (409 if in use)
      tags:
      - Dependencies
  /dependencies/platform-resource-types:
    get:
      operationId: list-platform-resource-types
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: ./components.yaml#/components/schemas/PlatformResourceTypeDTO
                type: array
                nullable: true
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: List the platform-provisioned resource types available on the cluster
      tags:
      - Dependencies
  /organizations:
    get:
      operationId: list-organizations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/OrganizationList
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: List organizations
      tags:
      - Organizations
  /projects:
    get:
      operationId: list-projects
      parameters:
      - description: Opaque pagination cursor
        explode: false
        in: query
        name: cursor
        schema:
          description: Opaque pagination cursor
          type: string
      - description: Case-insensitive substring match on name and displayName
        explode: false
        in: query
        name: search
        schema:
          description: Case-insensitive substring match on name and displayName
          type: string
      - description: Maximum number of items to return (server default when absent)
        explode: false
        in: query
        name: limit
        schema:
          description: Maximum number of items to return (server default when absent)
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/ProjectList
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: List projects
      tags:
      - Projects
    post:
      operationId: create-project
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/components/schemas/CreateProjectRequest
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Project
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Create a project
      tags:
      - Projects
  /projects/{projectName}:
    delete:
      operationId: delete-project
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Delete a project
      tags:
      - Projects
    get:
      operationId: get-project
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Project
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Get a project
      tags:
      - Projects
  /projects/{projectName}/agents/{conversationId}/messages:
    get:
      operationId: get-conversation
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: FE-chosen conversation uuid
        in: path
        name: conversationId
        required: true
        schema:
          description: FE-chosen conversation uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Rehydrate a chat conversation (messages only)
      tags:
      - GenAI
    post:
      operationId: create-turn
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: FE-chosen conversation uuid
        in: path
        name: conversationId
        required: true
        schema:
          description: FE-chosen conversation uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/components/schemas/TurnInputBody
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/TurnOutputBody
          description: Accepted
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Start a generation/chat turn (202 — runs detached; attach via the turn stream)
      tags:
      - GenAI
  /projects/{projectName}/build:
    post:
      operationId: build-project
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/components/schemas/BuildRequest
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/BuildResponse
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Trigger a project build
      tags:
      - Projects
  /projects/{projectName}/build/preflight:
    get:
      operationId: get-build-preflight
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/BuildPreflight
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Compute the build dependency-drawer preflight
      tags:
      - Projects
  /projects/{projectName}/build/{tag}:
    get:
      operationId: get-project-build
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Build tag
        in: path
        name: tag
        required: true
        schema:
          description: Build tag
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/BuildStatus
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Get project build status
      tags:
      - Projects
  /projects/{projectName}/builds:
    get:
      description: One entry per built spec version tag, newest first — each the tag's newest run with
        its frozen task tally.
      operationId: list-project-builds
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/BuildList
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: List project builds
      tags:
      - Projects
  /projects/{projectName}/components:
    get:
      operationId: list-components
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/ComponentList
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: List components
      tags:
      - Components
  /projects/{projectName}/components/{componentName}:
    get:
      operationId: get-component
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
        required: true
        schema:
          description: Component name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Component
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Get a component
      tags:
      - Components
  /projects/{projectName}/components/{componentName}/builds:
    get:
      operationId: list-builds
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
        required: true
        schema:
          description: Component name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/WorkflowRunList
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: List component builds
      tags:
      - Components
    post:
      operationId: trigger-build
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
        required: true
        schema:
          description: Component name (DNS-label slug)
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/WorkflowRun
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Trigger a component build
      tags:
      - Components
  /projects/{projectName}/components/{componentName}/builds/{buildName}/logs:
    get:
      operationId: get-build-logs
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
        required: true
        schema:
          description: Component name (DNS-label slug)
          type: string
      - description: Build WorkflowRun name (DNS-label slug)
        in: path
        name: buildName
        required: true
        schema:
          description: Build WorkflowRun name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/BuildLogs
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Get build logs
      tags:
      - Components
  /projects/{projectName}/components/{componentName}/configs:
    get:
      operationId: get-component-config
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
        required: true
        schema:
          description: Component name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/ComponentConfig
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Get component config
      tags:
      - Config
    put:
      operationId: update-component-config
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
        required: true
        schema:
          description: Component name (DNS-label slug)
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/components/schemas/UpdateConfigBody
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/ComponentConfig
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Update component config
      tags:
      - Config
  /projects/{projectName}/components/{componentName}/dependencies/{depName}/access-request:
    post:
      operationId: request-org-service-access
      parameters:
      - description: Consumer project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Consumer project name (DNS-label slug)
          type: string
      - description: Consumer component name
        in: path
        name: componentName
        required: true
        schema:
          description: Consumer component name
          type: string
      - description: org-service dependency name (the provider component)
        in: path
        name: depName
        required: true
        schema:
          description: org-service dependency name (the provider component)
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/AccessRequest
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Request access to a cross-project org-service dependency
      tags:
      - Dependencies
  /projects/{projectName}/components/{componentName}/dependencies/{depName}/provision:
    post:
      operationId: provision-platform-resource
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component the drawer opened on (context only)
        in: path
        name: componentName
        required: true
        schema:
          description: Component the drawer opened on (context only)
          type: string
      - description: Platform-resource dependency name
        in: path
        name: depName
        required: true
        schema:
          description: Platform-resource dependency name
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./components.yaml#/components/schemas/ProvisionBody
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/StatusMsg
          description: Accepted
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Provision a platform-resource dependency (async)
      tags:
      - Dependencies
  /projects/{projectName}/components/{componentName}/dependencies/{depName}/status:
    get:
      operationId: get-dependency-status
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component the drawer opened on (context only)
        in: path
        name: componentName
        required: true
        schema:
          description: Component the drawer opened on (context only)
          type: string
      - description: Dependency name
        in: path
        name: depName
        required: true
        schema:
          description: Dependency name
          type: string
      - description: 'Environment (default: development)'
        explode: false
        in: query
        name: environment
        schema:
          description: 'Environment (default: development)'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/DependencyStatus
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: ./components.yaml#/components/schemas/Error
          description: Error
      security:
      - userJWT: []
      summary: Get a dependency's provisioning status (outputs masked to names)
      tags:
      - Dependencies
  /projects/{projectName}/components/{componentName}/deployments:
    get:
      operationId: list-deployments
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
