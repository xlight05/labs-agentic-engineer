# Strict server + std ServeMux router generated from the committed contract
# (packages/contracts/api/v1/openapi.yaml). Run via `make gen-api`.
#
# models: false — the schema types (and operation Params) are emitted by the
# companion models pass into the SAME gen package (models_gen.go), so the server
# references them by bare name. No import-mapping: there is nothing to redirect
# now that schemas and server share one package.
package: gen
generate:
  std-http-server: true
  strict-server: true
  models: false
  # Bake the contract into the binary as GetSpec()/rawSpec() — the request
  # validator loads it from here, so no vendored copy of the YAML is embedded
  # (go:embed can't reach across the module boundary to packages/contracts).
  embedded-spec: true
output: internal/gen/server_gen.go
output-options:
  name-normalizer: ToCamelCaseWithInitialisms
  # Must match the models pass: the Params structs are emitted there (value
  # fields under this option), so the parameter-binding code generated here has
  # to bind into value fields too. Params that opt back into pointers do so via
  # x-go-type-skip-optional-pointer in the contract, honored by both passes.
  prefer-skip-optional-pointer: true
